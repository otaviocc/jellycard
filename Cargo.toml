[package]
name = "jellycard"
version = "0.1.0"
edition = "2024"
description = "Generate Jellyfin library card artwork: rounded text in a purple-to-cyan gradient on a transparent canvas."
license = "MIT"
readme = "README.md"
keywords = ["jellyfin", "artwork", "png", "gradient", "text"]
categories = ["command-line-utilities", "multimedia::images"]
exclude = ["CLAUDE.md", "Makefile", "rustfmt.toml"]

[[bin]]
name = "jellycard"
path = "src/main.rs"

[dependencies]
png = "0.17"
swash = "0.2"
